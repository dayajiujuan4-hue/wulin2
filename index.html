<!DOCTYPE html>
<html lang="ja">
<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>武林夜市 | Wulin Night Market</title>

  <link
    rel="stylesheet"
    href="./css/style.css"
  >

</head>

<body>

  <div id="loadingScreen">

    <div class="loading-panel">

      <div class="loading-en">
        WULIN NIGHT MARKET
      </div>

      <h1>
        武林夜市
      </h1>

      <div class="loading-line"></div>

      <p>
        夜市を準備しています...
      </p>

      <div id="loadingPercent">
        0%
      </div>

    </div>

  </div>


  <div id="startScreen">

    <div class="start-panel">

      <div class="start-small">
        HANGZHOU · CHINA
      </div>

      <h1>
        武林夜市
      </h1>

      <p>
        WULIN NIGHT MARKET
      </p>

      <button id="startButton">
        夜市を歩く
      </button>

      <div class="controls">

        WASD：移動<br>
        SHIFT：走る<br>
        マウス：視点操作

      </div>

    </div>

  </div>


  <div id="hud">

    <div class="hud-city">
      杭州 · HANGZHOU
    </div>

    <div class="hud-title">
      武林夜市
    </div>

    <div id="zoneName">
      武林路入口
    </div>

  </div>


  <div id="timeHud">
    20:18
  </div>


  <div id="fps">
    FPS --
  </div>


  <div id="areaPopup">

    <div class="area-small">
      AREA DISCOVERED
    </div>

    <div id="areaPopupName">
      武林夜市
    </div>

  </div>


  <div id="qualityPanel">

    <span>
      GRAPHICS
    </span>

    <button data-quality="low">
      LOW
    </button>

    <button
      data-quality="medium"
      class="active"
    >
      MED
    </button>

    <button data-quality="high">
      HIGH
    </button>

  </div>


  <div id="crosshair">
    +
  </div>


  <div id="interaction">
  </div>


  <div id="vignette">
  </div>


  <div id="errorScreen">

    <h2>
      読み込みエラー
    </h2>

    <p>
      F12 → Console を確認してください。
    </p>

  </div>


  <script type="importmap">
  {
    "imports": {

      "three":
        "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",

      "three/addons/":
        "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"

    }
  }
  </script>


  <script
    type="module"
    src="./js/main.js"
  ></script>

</body>
</html>
